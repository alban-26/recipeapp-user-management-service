

quarkus.http.port=8082
quarkus.http.host=0.0.0.0

#FOR DEV (webapp)
#quarkus.http.cors=true
#quarkus.http.cors.origins=*
#quarkus.http.cors.methods=*
#quarkus.http.cors.headers=*

# Keycloak connection
keycloak.url=http://keycloak:8080
keycloak.realm=recipeapp
keycloak.client-id=recipeapp
keycloak.client-secret=${OIDC_SECRET}
keycloak.admin.client-id=loveyourmeal
keycloak.admin.client-secret=${OIDC_ADMIN_SECRET}

# Login mit Offline Token: der Refresh Token haengt dann nicht mehr an der
# SSO-Session (Standard 30 min Leerlauf / 10 h Maximum) und ueberlebt einen
# Keycloak-Neustart. Es gilt stattdessen "Offline Session Idle" (Standard 30 Tage).
# Lehnt der Realm den Scope ab, wird automatisch ohne Scope eingeloggt.
# Leer lassen fuer das alte Verhalten. Gilt fuer alle Profile.
keycloak.login-scope=offline_access
keycloak.request-timeout-ms=10000

# OIDC Configuration
quarkus.oidc.auth-server-url=https://admin.loveyourmeal.cloud/realms/recipeapp
quarkus.oidc.client-id=recipeapp
quarkus.oidc.credentials.secret=${OIDC_SECRET}
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=https://admin.loveyourmeal.cloud/realms/recipeapp
quarkus.oidc.roles.source=accesstoken


# Public access to /users/login (order matters!)
quarkus.http.auth.permission.public.paths=/users/login,/users/refresh,/users/register,/users/forgot-password,/users/logout
quarkus.http.auth.permission.public.policy=permit

# Secure all other paths
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# Docker Container Image
quarkus.container-image.build=true
quarkus.container-image.push=false
quarkus.container-image.registry=docker.io
quarkus.container-image.group=myapp
quarkus.container-image.name=user-management
quarkus.container-image.tag=1.0.0-SNAPSHOT


# Console
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c] (%t) %s%e%n

quarkus.log.handler.gelf.enabled=true
quarkus.log.handler.gelf.host=logstash
quarkus.log.handler.gelf.port=5000
quarkus.log.handler.gelf.include-full-mdc=true
quarkus.log.handler.gelf.include-location=true

# Optional: Console Logging
quarkus.log.console.json=false
quarkus.log.level=INFO